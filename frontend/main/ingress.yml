apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host:
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-service
                port:
                  number: 80
          
          - path: /mobiles
            pathType: Prefix
            backend:
              service:
                name: mobiles-service
                port:
                  number: 80

          - path: /electronics
            pathType: Prefix
            backend:
              service:
                name: electronics-service
                port:
                  number: 80
